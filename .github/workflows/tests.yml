name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        db: [sqlite, postgres]

    services:
      postgres:
        # an empty image skips the service, so only the postgres leg starts it
        image: ${{ matrix.db == 'postgres' && 'postgres:16' || '' }}
        env:
          POSTGRES_USER: perfima
          POSTGRES_PASSWORD: perfima
          POSTGRES_DB: perfima_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U perfima -d perfima_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      # checked out into perfima/ so the package imports as perfima.* from the workspace root
      - uses: actions/checkout@v5
        with:
          path: perfima

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: perfima/requirements.txt

      - name: Install dependencies
        run: pip install -r perfima/requirements.txt

      - name: Use Postgres
        if: matrix.db == 'postgres'
        run: |
          echo "DATABASE_URL=postgresql+psycopg://perfima:perfima@localhost:5432/perfima_test" >> "$GITHUB_ENV"
          echo "TEST_DATABASE_URL=postgresql+psycopg://perfima:perfima@localhost:5432/perfima_test" >> "$GITHUB_ENV"

      - name: Run tests
        run: PYTHONPATH=. pytest perfima/tests -q
