services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-perfima}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-perfima}
      POSTGRES_DB: ${POSTGRES_DB:-perfima}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-perfima}:${POSTGRES_PASSWORD:-perfima}@db:5432/${POSTGRES_DB:-perfima}
      SECRET_KEY: ${SECRET_KEY:-change-me}
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318
      OTEL_SERVICE_NAME: perfima
    ports:
      - "${API_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy
      jaeger:
        condition: service_started

  # Trace viewer, open http://localhost:16686 and pick the perfima service
  jaeger:
    image: jaegertracing/all-in-one:1.60
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "${JAEGER_UI_PORT:-16686}:16686"
      # lets an API started outside docker send traces too
      - "${OTLP_HTTP_PORT:-4318}:4318"

volumes:
  pgdata:
